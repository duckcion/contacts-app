<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContactBook</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0f;
      --bg2: #1a1a1a;
      --bg3: #242424;
      --border: #2e2e2e;
      --border-bright: #444;
      --text: #e8e8e8;
      --text-muted: #888;
      --text-dim: #555;
      --accent: #00ff88;
      --accent-dim: #00994d;
      --danger: #ff4466;
      --warn: #ffaa00;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .logo span { color: var(--text-muted); font-weight: 400; }

    .header-actions { display: flex; gap: 0.75rem; align-items: center; }

    /* ── BUTTONS ── */
    .btn {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding: 0.45rem 1rem;
      border-radius: 2px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: #00ffaa; border-color: #00ffaa; }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border-color: var(--border);
    }
    .btn-ghost:hover { border-color: var(--border-bright); color: var(--text); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger);
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.7rem; }

    /* ── LAYOUT ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 320px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 56px);
      position: sticky;
      top: 56px;
    }

    .sidebar-top {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.8rem;
      padding: 0.55rem 0.75rem 0.55rem 2.2rem;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input:focus { border-color: var(--accent-dim); }
    .search-wrap input::placeholder { color: var(--text-dim); }

    .search-icon {
      position: absolute;
      left: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.75rem;
      font-family: var(--mono);
      pointer-events: none;
    }

    .count-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }
    .count-label span { color: var(--accent); }

    .contact-list {
      overflow-y: auto;
      flex: 1;
    }

    .contact-item {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .contact-item:hover { background: var(--bg2); }
    .contact-item.active { background: var(--bg3); border-left: 2px solid var(--accent); padding-left: calc(1rem - 2px); }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 2px;
      background: var(--bg3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      flex-shrink: 0;
    }

    .contact-meta { overflow: hidden; }

    .contact-name {
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-sub {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 0.15rem;
    }

    /* ── MAIN PANEL ── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      height: calc(100vh - 56px);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 1rem;
      color: var(--text-dim);
    }

    .empty-state .big {
      font-family: var(--mono);
      font-size: 3rem;
      opacity: 0.15;
    }

    .empty-state p {
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    /* ── CONTACT DETAIL ── */
    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .detail-identity { display: flex; align-items: center; gap: 1.25rem; }

    .avatar-lg {
      width: 56px;
      height: 56px;
      border-radius: 2px;
      background: var(--bg3);
      border: 1px solid var(--border-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent);
    }

    .detail-name {
      font-size: 1.4rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .detail-company {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    .detail-actions { display: flex; gap: 0.5rem; }

    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .field { display: flex; flex-direction: column; gap: 0.35rem; }

    .field-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .field-value {
      font-size: 0.9rem;
      color: var(--text);
    }

    .field-value a {
      color: var(--accent);
      text-decoration: none;
    }
    .field-value a:hover { text-decoration: underline; }

    .field-value.empty { color: var(--text-dim); font-style: italic; font-size: 0.82rem; }

    .timestamp {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    /* ── MODAL ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border-bright);
      border-radius: 4px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-family: var(--mono);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.2rem;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }

    .modal-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }

    .form-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .form-label .req { color: var(--accent); margin-left: 0.2rem; }

    .form-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.875rem;
      padding: 0.55rem 0.75rem;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--accent-dim); }
    .form-input.error { border-color: var(--danger); }
    .form-input::placeholder { color: var(--text-dim); }

    .field-error {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--danger);
    }

    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 300;
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 0.75rem 1.25rem;
      border-radius: 2px;
      border-left: 3px solid var(--accent);
      background: var(--bg2);
      color: var(--text);
      transform: translateY(120%);
      transition: transform 0.25s ease;
      max-width: 320px;
    }
    .toast.show { transform: translateY(0); }
    .toast.error { border-left-color: var(--danger); }

    .hidden { display: none !important; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

    @media (max-width: 720px) {
      .sidebar { width: 100%; position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
      .layout { flex-direction: column; }
      .main { height: auto; }
      .fields-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Contact<span>Book</span></div>
  <div class="header-actions">
    <button class="btn btn-primary" id="btn-new">+ New Contact</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="search-wrap">
        <span class="search-icon">/</span>
        <input type="text" id="search-input" placeholder="Search contacts..." autocomplete="off" />
      </div>
      <div class="count-label"><span id="count">0</span> contacts</div>
    </div>
    <div class="contact-list" id="contact-list"></div>
  </aside>

  <main class="main" id="main-panel">
    <div class="empty-state" id="empty-state">
      <div class="big">◈</div>
      <p>Select a contact to view details</p>
    </div>
    <div id="detail-view" class="hidden"></div>
  </main>
</div>

<!-- Modal -->
<div class="overlay hidden" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">New Contact</span>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name <span class="req">*</span></label>
          <input class="form-input" id="f-first" placeholder="Alice" />
          <span class="field-error hidden" id="e-first"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name <span class="req">*</span></label>
          <input class="form-input" id="f-last" placeholder="Smith" />
          <span class="field-error hidden" id="e-last"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email <span class="req">*</span></label>
        <input class="form-input" id="f-email" type="email" placeholder="alice@example.com" />
        <span class="field-error hidden" id="e-email"></span>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input class="form-input" id="f-phone" placeholder="555-0100" />
        </div>
        <div class="form-group">
          <label class="form-label">Company</label>
          <input class="form-input" id="f-company" placeholder="Acme Corp" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Address</label>
        <input class="form-input" id="f-address" placeholder="123 Main St, City, State" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btn-cancel">Cancel</button>
      <button class="btn btn-primary" id="btn-save">Save Contact</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API = '/api/contacts';
  let contacts = [];
  let selectedId = null;
  let editingId = null;
  let searchTimer = null;

  // ── API helpers ──────────────────────────────────────────────────────────

  async function apiFetch(path, options = {}) {
    const res = await fetch(path, {
      headers: { 'Content-Type': 'application/json' },
      ...options,
    });
    if (res.status === 204) return null;
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Request failed');
    return json;
  }

  async function loadContacts(search = '') {
    const url = search ? `${API}?search=${encodeURIComponent(search)}&limit=100` : `${API}?limit=100`;
    const data = await apiFetch(url);
    contacts = data.data;
    document.getElementById('count').textContent = data.pagination.total;
    renderList();
  }

  // ── RENDER ───────────────────────────────────────────────────────────────

  function initials(c) {
    return (c.first_name[0] + c.last_name[0]).toUpperCase();
  }

  function renderList() {
    const list = document.getElementById('contact-list');
    if (contacts.length === 0) {
      list.innerHTML = '<div style="padding:1.5rem 1rem;text-align:center;font-family:var(--mono);font-size:0.75rem;color:var(--text-dim)">No contacts found</div>';
      return;
    }
    list.innerHTML = contacts.map(c => `
      <div class="contact-item ${c.id === selectedId ? 'active' : ''}" data-id="${c.id}">
        <div class="avatar">${initials(c)}</div>
        <div class="contact-meta">
          <div class="contact-name">${esc(c.first_name + ' ' + c.last_name)}</div>
          <div class="contact-sub">${esc(c.company || c.email)}</div>
        </div>
      </div>
    `).join('');

    list.querySelectorAll('.contact-item').forEach(el => {
      el.addEventListener('click', () => selectContact(+el.dataset.id));
    });
  }

  function renderDetail(c) {
    const detail = document.getElementById('detail-view');
    detail.innerHTML = `
      <div class="detail-header">
        <div class="detail-identity">
          <div class="avatar-lg">${initials(c)}</div>
          <div>
            <div class="detail-name">${esc(c.first_name + ' ' + c.last_name)}</div>
            ${c.company ? `<div class="detail-company">${esc(c.company)}</div>` : ''}
          </div>
        </div>
        <div class="detail-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEdit(${c.id})">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteContact(${c.id})">Delete</button>
        </div>
      </div>
      <div class="fields-grid">
        <div class="field">
          <div class="field-label">Email</div>
          <div class="field-value"><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>
        </div>
        <div class="field">
          <div class="field-label">Phone</div>
          <div class="field-value ${!c.phone ? 'empty' : ''}">${c.phone ? `<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : 'Not provided'}</div>
        </div>
        <div class="field">
          <div class="field-label">Company</div>
          <div class="field-value ${!c.company ? 'empty' : ''}">${c.company ? esc(c.company) : 'Not provided'}</div>
        </div>
        <div class="field">
          <div class="field-label">Address</div>
          <div class="field-value ${!c.address ? 'empty' : ''}">${c.address ? esc(c.address) : 'Not provided'}</div>
        </div>
      </div>
      <div class="timestamp">
        Created: ${new Date(c.created_at).toLocaleString()} &nbsp;·&nbsp;
        Updated: ${new Date(c.updated_at).toLocaleString()}
      </div>
    `;
    document.getElementById('empty-state').classList.add('hidden');
    detail.classList.remove('hidden');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── ACTIONS ──────────────────────────────────────────────────────────────

  function selectContact(id) {
    selectedId = id;
    renderList();
    const c = contacts.find(x => x.id === id);
    if (c) renderDetail(c);
  }

  function openNew() {
    editingId = null;
    document.getElementById('modal-title').textContent = 'New Contact';
    clearForm();
    document.getElementById('modal-overlay').classList.remove('hidden');
    document.getElementById('f-first').focus();
  }

  function openEdit(id) {
    editingId = id;
    const c = contacts.find(x => x.id === id);
    if (!c) return;
    document.getElementById('modal-title').textContent = 'Edit Contact';
    document.getElementById('f-first').value = c.first_name || '';
    document.getElementById('f-last').value = c.last_name || '';
    document.getElementById('f-email').value = c.email || '';
    document.getElementById('f-phone').value = c.phone || '';
    document.getElementById('f-company').value = c.company || '';
    document.getElementById('f-address').value = c.address || '';
    clearErrors();
    document.getElementById('modal-overlay').classList.remove('hidden');
    document.getElementById('f-first').focus();
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
    clearForm();
  }

  function clearForm() {
    ['f-first','f-last','f-email','f-phone','f-company','f-address'].forEach(id => {
      document.getElementById(id).value = '';
    });
    clearErrors();
  }

  function clearErrors() {
    ['e-first','e-last','e-email'].forEach(id => {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.textContent = '';
    });
    ['f-first','f-last','f-email'].forEach(id => {
      document.getElementById(id).classList.remove('error');
    });
  }

  async function saveContact() {
    clearErrors();
    const payload = {
      first_name: document.getElementById('f-first').value.trim(),
      last_name:  document.getElementById('f-last').value.trim(),
      email:      document.getElementById('f-email').value.trim(),
      phone:      document.getElementById('f-phone').value.trim() || null,
      company:    document.getElementById('f-company').value.trim() || null,
      address:    document.getElementById('f-address').value.trim() || null,
    };

    let valid = true;
    if (!payload.first_name) { showFieldError('f-first', 'e-first', 'Required'); valid = false; }
    if (!payload.last_name)  { showFieldError('f-last',  'e-last',  'Required'); valid = false; }
    if (!payload.email)      { showFieldError('f-email', 'e-email', 'Required'); valid = false; }
    if (!valid) return;

    try {
      if (editingId) {
        const updated = await apiFetch(`${API}/${editingId}`, { method: 'PUT', body: JSON.stringify(payload) });
        const idx = contacts.findIndex(x => x.id === editingId);
        if (idx !== -1) contacts[idx] = updated;
        renderList();
        renderDetail(updated);
        toast('Contact updated');
      } else {
        const created = await apiFetch(API, { method: 'POST', body: JSON.stringify(payload) });
        contacts.unshift(created);
        document.getElementById('count').textContent = +document.getElementById('count').textContent + 1;
        renderList();
        selectContact(created.id);
        toast('Contact created');
      }
      closeModal();
    } catch (err) {
      toast(err.message, true);
    }
  }

  async function deleteContact(id) {
    if (!confirm('Delete this contact? This cannot be undone.')) return;
    try {
      await apiFetch(`${API}/${id}`, { method: 'DELETE' });
      contacts = contacts.filter(c => c.id !== id);
      document.getElementById('count').textContent = +document.getElementById('count').textContent - 1;
      selectedId = null;
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('empty-state').classList.remove('hidden');
      renderList();
      toast('Contact deleted');
    } catch (err) {
      toast(err.message, true);
    }
  }

  function showFieldError(inputId, errorId, msg) {
    document.getElementById(inputId).classList.add('error');
    const el = document.getElementById(errorId);
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  // ── TOAST ────────────────────────────────────────────────────────────────

  let toastTimer;
  function toast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${isError ? 'error' : ''}`;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }

  // ── EVENT WIRING ─────────────────────────────────────────────────────────

  document.getElementById('btn-new').addEventListener('click', openNew);
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('btn-save').addEventListener('click', saveContact);

  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'modal-overlay') closeModal();
  });

  document.getElementById('search-input').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => loadContacts(e.target.value.trim()), 300);
  });

  // keyboard shortcut: Enter in modal
  document.getElementById('modal-overlay').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) saveContact();
    if (e.key === 'Escape') closeModal();
  });

  // ── INIT ─────────────────────────────────────────────────────────────────

  loadContacts();
</script>
</body>
</html>
